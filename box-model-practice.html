<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Mastery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            padding: 40px;
            background-color: #f4f4f9;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #333;
        }

        .demo-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 150px;
            height: 100px;
            background-color: #3498db;
            color: white;
            text-align: center;
            padding-top: 35px;
            font-weight: bold;
        }

        .box-content {
            
        }

        .box-padding {
            padding: 20px;
            background-color: #2ecc71;
        }

        .box-border {
            border: 5px solid #2c3e50;
            background-color: #e67e22;
        }

        .box-margin {
            margin-left: 30px; 
            background-color: #9b59b6;
        }

        .broken-box {
            width: 300px;
            padding: 20px;
            border: none;
            background-color: #e74c3c;
            color: white;
            box-sizing: border-box; 
        }

        .card {
            width: 300px;
            border: 1px solid gray;
            background-color: white;
            box-sizing: border-box; 
        }

        .card-img {
            width: 100%;
            height: 150px;
            background-color: #bdc3c7; 
            display: block;
        }

        .card-body {
            padding: 20px; 
        }

        .card-title {
            margin-bottom: 15px; 
            font-size: 1.25rem;
            color: #2c3e50;
        }

        .card-text {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
        }

        .card-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Box Model Practice</h1>
    <h2>Exercise 1: Box Model Visualization</h2>
    <div class="demo-container">
        <div class="box box-content">Content</div>
        <div class="box box-padding">Padding</div>
        <div class="box box-border">Border</div>
        <div class="box box-margin">Margin</div>
    </div>

    <h2>Exercise 2: Debug the Layout</h2>
    <div class="broken-box">
        This box is now exactly 300px wide thanks to border-box!
    </div>

    <h2>Exercise 3: Card Component</h2>
    <div class="card">
        <div class="card-img"></div> 
        
        <div class="card-body">
            <h3 class="card-title">Card Title Here</h3>
            <p class="card-text">This is a description text explaining what the card is about.</p>
            <button class="card-btn">Click Action</button>
        </div>
    </div>

</body>
</html>
